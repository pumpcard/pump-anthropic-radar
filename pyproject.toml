[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pump-anthropic-radar"
version = "0.0.1"
description = "Anthropic infrastructure FinOps SDK — scan, analyze, and export your Anthropic org resources"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "pump.co" }, { name = "Mor Michaeli" }]
keywords = ["anthropic", "claude", "finops", "cloud-cost", "llm", "radar", "hyperscaler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.31",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
# Export formats — CSV and draw.io ship in the base install; these are kept as
# no-op aliases so existing `pump-anthropic-radar[csv]` / `[drawio]` pins keep resolving.
csv = []
drawio = []

# Full install
all = []

dev = ["pytest>=8.0"]

[dependency-groups]
dev = ["ruff>=0.16.10", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.urls]
Homepage = "https://github.com/pumpcard/pump-anthropic-radar"
Repository = "https://github.com/pumpcard/pump-anthropic-radar"
"Bug Tracker" = "https://github.com/pumpcard/pump-anthropic-radar/issues"

[project.scripts]
pump-anthropic-radar = "anthropic_radar.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/anthropic_radar"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
